<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CRRT calc.js: test suite</title>
<style>
  body { font-family: ui-monospace, "IBM Plex Mono", monospace; background: #12161A; color: #E8E4DC; padding: 2rem; }
  .pass { color: #3FB8AF; }
  .fail { color: #E5533D; font-weight: bold; }
  .case { margin-bottom: 0.6rem; padding: 0.5rem 0.8rem; border-left: 3px solid #333; }
  .case.fail-case { border-left-color: #E5533D; background: #1B2127; }
  h1 { font-size: 1.1rem; }
  #summary { font-size: 1rem; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #333; }
</style>
</head>
<body>
<h1>CRRT calc.js: worked example test suite (spec §7)</h1>
<div id="results"></div>
<div id="summary"></div>

<script src="../js/calc.js"></script>
<script src="../js/schematic.js"></script>
<script src="../js/ui-calculator.js"></script>
<script>
(function () {
  const C = window.CRRTCalc;
  const results = [];
  let pass = 0, fail = 0;

  function approx(actual, expected, tol) {
    return Math.abs(actual - expected) <= tol;
  }

  function check(label, actual, expected, tol = 0.1) {
    const ok = approx(actual, expected, tol);
    if (ok) pass++; else fail++;
    results.push({ label, actual, expected, ok });
  }

  // --- A: Dose and filtration fraction ---
  // 80 kg, Hct 0.30, CVVHDF, Qb 150, Qd 1500, post 500, netUF 100, no pre-dilution, uptime 1.0
  const A = C.computeDoseAndFF({
    weightKg: 80,
    hematocrit: 0.30,
    bloodFlow_mL_min: 150,
    dialysateFlow_mL_hr: 1500,
    replacementPre_mL_hr: 0,
    replacementPost_mL_hr: 500,
    netUltrafiltration_mL_hr: 100,
    citrateFlow_mL_hr: 0,
    uptimeFraction: 1.0,
  });
  check('A: effluent rate = 2100 mL/hr', A.effluentRate_mL_hr, 2100, 0.01);
  check('A: prescribed dose = 26.25 mL/kg/hr', A.prescribedDose_mL_kg_hr, 26.25, 0.01);
  check('A: plasma flow = 6300 mL/hr', A.plasmaFlow_mL_hr, 6300, 0.01);
  check('A: FF = 0.0952 (9.5%)', A.filtrationFraction, 0.0952, 0.001);
  check('A: FF flag = green', A.ffFlag === 'green' ? 1 : 0, 1, 0);

  // --- B: Downtime ---
  const B = C.computeDoseAndFF({
    weightKg: 80,
    hematocrit: 0.30,
    bloodFlow_mL_min: 150,
    dialysateFlow_mL_hr: 1500,
    replacementPre_mL_hr: 0,
    replacementPost_mL_hr: 500,
    netUltrafiltration_mL_hr: 100,
    citrateFlow_mL_hr: 0,
    uptimeFraction: 0.90,
  });
  check('B: delivered dose = 23.6 mL/kg/hr (uptime 0.90)', B.deliveredDose_mL_kg_hr, 23.6, 0.05);

  // --- C: Pre-dilution correction ---
  // Same as A but 500 mL/hr replacement moved to pre-filter
  const Cx = C.computeDoseAndFF({
    weightKg: 80,
    hematocrit: 0.30,
    bloodFlow_mL_min: 150,
    dialysateFlow_mL_hr: 1500,
    replacementPre_mL_hr: 500,
    replacementPost_mL_hr: 0,
    netUltrafiltration_mL_hr: 100,
    citrateFlow_mL_hr: 0,
    uptimeFraction: 1.0,
  });
  check('C: effluent still 2100 mL/hr', Cx.effluentRate_mL_hr, 2100, 0.01);
  check('C: prescribed still 26.25 mL/kg/hr', Cx.prescribedDose_mL_kg_hr, 26.25, 0.01);
  check('C: plasma flow = 6300 mL/hr', Cx.plasmaWaterFlow_mL_hr, 6300, 1);
  check('C: dilution factor = 0.9265', Cx.dilutionFactor, 0.9265, 0.001);
  check('C: corrected dose = 24.32 mL/kg/hr', Cx.correctedDose_mL_kg_hr, 24.32, 0.1);
  check('C: FF includes pre-replacement = 0.0882 (8.8%)', Cx.filtrationFraction, 0.0882, 0.001);
  check('C: total UF includes pre-replacement = 600 mL/hr', Cx.totalUltrafiltration_mL_hr, 600, 0.01);

  // --- D: Citrate, concentrated ACD-A ---
  const D = C.citrateFlowFromTargetDose({
    bloodFlow_mL_min: 150,
    targetCitrateDose_mmol_L: 3.0,
    citrateConcentration_mmol_L: 113,
  });
  check('D: ACD-A citrate flow = 238.9 mL/hr', D.citrateFlow_mL_hr, 238.9, 0.5);

  // --- E: Citrate, dilute pre-filter (Prismocitrate 18/0) ---
  const E = C.citrateFlowFromTargetDose({
    bloodFlow_mL_min: 150,
    targetCitrateDose_mmol_L: 3.0,
    citrateConcentration_mmol_L: 18,
  });
  check('E: Prismocitrate flow = 1500 mL/hr', E.citrateFlow_mL_hr, 1500, 0.5);

  // E continued: this citrate flow must propagate as pre-dilution fluid
  // and change dose/FF relative to example A.
  const Eprop = C.computeDoseAndFF({
    weightKg: 80,
    hematocrit: 0.30,
    bloodFlow_mL_min: 150,
    dialysateFlow_mL_hr: 1500,
    replacementPre_mL_hr: 0,
    replacementPost_mL_hr: 500,
    netUltrafiltration_mL_hr: 100,
    citrateFlow_mL_hr: E.citrateFlow_mL_hr,
    citratePreFilter: true,
    uptimeFraction: 1.0,
  });
  check(
    'E: citrate flow propagates into effluent (3600 mL/hr, != example A 2100)',
    Eprop.effluentRate_mL_hr,
    3600,
    0.01
  );
  check(
    'E: citrate flow propagates into pre-dilution total',
    Eprop.citrateAsPreDilution_mL_hr,
    1500,
    0.01
  );

  // --- F: Inverse citrate dose ---
  const F = C.citrateDoseFromFlow({
    citrateFlow_mL_hr: 200,
    citrateConcentration_mmol_L: 113,
    bloodFlow_mL_min: 180,
  });
  check('F: actual citrate dose = 2.09 mmol/L', F.actualCitrateDose_mmol_L, 2.09, 0.02);
  check('F: dose flag = amber (below target range)', F.doseFlag === 'amber' ? 1 : 0, 1, 0);

  // --- G: Accumulation ---
  const G = C.citrateAccumulationCheck({ totalCa_mmol_L: 3.0, systemicICa_mmol_L: 1.05 });
  check('G: Ca ratio = 2.86', G.caRatio, 2.86, 0.01);
  check('G: accumulation flag = true', G.accumulationFlag ? 1 : 0, 1, 0);

  // --- H: Heparin ---
  const H = C.computeHeparinDosing({
    weightKg: 80,
    bolusUnitsPerKg: 25,
    infusionUnitsPerKgHr: 7.5,
    heparinConcentration_units_mL: 100,
  });
  check('H: bolus = 2000 units', H.bolusUnits, 2000, 0.01);
  check('H: infusion = 600 units/hr', H.infusionUnits_hr, 600, 0.01);
  check('H: infusion rate = 6.0 mL/hr', H.infusionRate_mL_hr, 6.0, 0.01);

  const Hfixed = C.computeHeparinDosing({
    weightKg: 80,
    bolusUnits: 750,
    infusionUnitsPerKgHr: 7.5,
    heparinConcentration_units_mL: 100,
  });
  check('H: fixed generic bolus = 750 units', Hfixed.bolusUnits, 750, 0.01);

  // --- I: Phosphate ---
  const I = C.estimatePhosphateRemoval({ effluentRate_mL_hr: 2100, serumPO4_mmol_L: 1.0 });
  check('I: PO4 removal ≈ 50.4 mmol/day', I.po4Removal_mmol_day, 50.4, 0.1);

  // --- J: Sodium gradient ---
  const J = C.sodiumGradientCheck({ serumNa_mmol_L: 110, solutionNa_mmol_L: 140 });
  check('J: gradient = 30 mmol/L', J.gradient_mmol_L, 30, 0.01);
  check('J: flag = true (red)', J.flag ? 1 : 0, 1, 0);

  // --- Guided starting prescription ---
  const K = C.suggestPrescription({
    weightKg: 80,
    hematocrit: 0.30,
    modality: 'CVVHDF',
    bloodFlow_mL_min: 150,
    targetDeliveredDose_mL_kg_hr: 22.5,
    uptimeFraction: 0.90,
    netUltrafiltration_mL_hr: 0,
    citrateFlow_mL_hr: 239,
    citratePreFilter: true,
  });
  check('K: suggested delivered dose is near 22.5', K.predictedDeliveredDose_mL_kg_hr, 22.5, 0.8);
  check('K: suggested FF is at or below the 25% default ceiling', K.predictedFiltrationFraction <= 0.2505 ? 1 : 0, 1, 0);
  check('K: target reported as achieved', K.targetAchieved === true ? 1 : 0, 1, 0);

  // --- K2: FF ceiling must hold across modalities, weights, and blood flows ---
  // Regression guard: the previous suggestPrescription hit the dose target by
  // pushing filtration fraction to 30-90%, which is not physiologically safe.
  const K2cases = [
    { weightKg: 80,  modality: 'CVVH',   bloodFlow_mL_min: 150 },
    { weightKg: 120, modality: 'CVVH',   bloodFlow_mL_min: 150 },
    { weightKg: 150, modality: 'CVVH',   bloodFlow_mL_min: 100 },
    { weightKg: 80,  modality: 'CVVH',   bloodFlow_mL_min: 100 },
    { weightKg: 80,  modality: 'CVVH',   hematocrit: 0.45 },
    { weightKg: 80,  modality: 'CVVH',   netUltrafiltration_mL_hr: 300 },
    { weightKg: 150, modality: 'CVVHDF', bloodFlow_mL_min: 100 },
    { weightKg: 80,  modality: 'CVVHDF', citrateFlow_mL_hr: 1500 },
    { weightKg: 40,  modality: 'CVVH' },
    { weightKg: 80,  modality: 'CVVHD' },
  ];
  let k2Breaches = 0, k2Unwarned = 0;
  K2cases.forEach(cfg => {
    const s = C.suggestPrescription(Object.assign({ hematocrit: 0.30, uptimeFraction: 0.90 }, cfg));
    if (Number.isFinite(s.predictedFiltrationFraction) && s.predictedFiltrationFraction > 0.2505) k2Breaches++;
    if (s.targetAchieved === false && (!s.warnings || s.warnings.length === 0)) k2Unwarned++;
    if (s.replacementPre_mL_hr < 0 || s.replacementPost_mL_hr < 0 || s.dialysateFlow_mL_hr < 0) k2Unwarned++;
  });
  check('K2: no FF breach across 10 modality/weight/flow combinations', k2Breaches, 0, 0);
  check('K2: every unachievable target carries a warning', k2Unwarned, 0, 0);

  // --- K3: net UF alone above ceiling must warn, not silently pass ---
  const K3 = C.suggestPrescription({
    weightKg: 70, modality: 'SCUF', bloodFlow_mL_min: 80,
    hematocrit: 0.45, netUltrafiltration_mL_hr: 800, uptimeFraction: 0.90,
  });
  check('K3: impossible net UF at low Qb produces a warning', K3.warnings.length > 0 ? 1 : 0, 1, 0);

  // --- v1.7.0 regression tests (audit 2026-09-23) ---

  // R1: configurable ceiling is a hard constraint at 20% as well as 25%.
  let r1 = 0;
  [0.20, 0.25, 0.30].forEach(ceil => {
    [40, 80, 120, 150].forEach(w => {
      ['CVVH', 'CVVHDF'].forEach(m => {
        const s = C.suggestPrescription({ weightKg: w, hematocrit: 0.30, modality: m, bloodFlow_mL_min: 150,
          targetDeliveredDose_mL_kg_hr: 25, uptimeFraction: 0.9, ffCeiling: ceil, preFilterShare: 0.5 });
        if (s.predictedFiltrationFraction > ceil + 1e-9) r1++;
      });
    });
  });
  check('R1: FF never exceeds the configured ceiling (20/25/30%)', r1, 0, 0);

  // R2: flags follow the configured ceiling.
  const R2 = C.computeDoseAndFF({ weightKg: 80, hematocrit: 0.3, bloodFlow_mL_min: 150,
    replacementPost_mL_hr: 1400, ffCeiling: 0.20, ffRedThreshold: 0.30 });
  check('R2: FF 22% is amber with a 20% ceiling', R2.ffFlag === 'amber' ? 1 : 0, 1, 0);
  const R2b = C.computeDoseAndFF({ weightKg: 80, hematocrit: 0.3, bloodFlow_mL_min: 150,
    replacementPost_mL_hr: 1400, ffCeiling: 0.25, ffRedThreshold: 0.30 });
  check('R2: FF 22% is green with a 25% ceiling', R2b.ffFlag === 'green' ? 1 : 0, 1, 0);

  // R3: protocol pre-filter share is applied inside the engine (no UI split).
  const R3h = C.suggestPrescription({ weightKg: 80, hematocrit: 0.3, modality: 'CVVHDF', bloodFlow_mL_min: 150,
    targetDeliveredDose_mL_kg_hr: 25, uptimeFraction: 0.9, preFilterShare: 0.5 });
  check('R3: heparin 50/50 split of replacement',
    Math.abs(R3h.replacementPre_mL_hr - R3h.replacementPost_mL_hr) <= 50 ? 1 : 0, 1, 0);
  const R3c = C.suggestPrescription({ weightKg: 80, hematocrit: 0.3, modality: 'CVVHDF', bloodFlow_mL_min: 150,
    targetDeliveredDose_mL_kg_hr: 25, uptimeFraction: 0.9, citrateFlow_mL_hr: 239, preFilterShare: 0.2 });
  const r3share = R3c.replacementPre_mL_hr / (R3c.replacementPre_mL_hr + R3c.replacementPost_mL_hr);
  check('R3: citrate pre-filter share at least 20% (minus rounding)', r3share >= 0.14 ? 1 : 0, 1, 0);

  // R4: no false "target not reached" from rounding at normal weights.
  let r4 = 0;
  [40, 60, 80, 100, 120, 150].forEach(w => {
    [[0, 0.5], [239, 0.2], [1500, 0.2]].forEach(([cit, share]) => {
      ['CVVHDF', 'CVVHD'].forEach(m => {
        const s = C.suggestPrescription({ weightKg: w, hematocrit: 0.3, modality: m, bloodFlow_mL_min: 150,
          targetDeliveredDose_mL_kg_hr: 25, uptimeFraction: 0.9, netUltrafiltration_mL_hr: 100,
          citrateFlow_mL_hr: cit, preFilterShare: share });
        if (s.targetAchieved === false) r4++;
        if (s.predictedDeliveredDose_mL_kg_hr < 24.5) r4++;
      });
    });
  });
  check('R4: CVVHDF/CVVHD reach target within 0.5 mL/kg/hr at 40 to 150 kg', r4, 0, 0);

  // R5: dilute citrate dose floor warns; tiny post-filter flows are not generated.
  const R5 = C.suggestPrescription({ weightKg: 40, hematocrit: 0.3, modality: 'CVVHDF', bloodFlow_mL_min: 150,
    targetDeliveredDose_mL_kg_hr: 25, uptimeFraction: 0.9, netUltrafiltration_mL_hr: 100,
    citrateFlow_mL_hr: 1500, preFilterShare: 0.2 });
  check('R5: 40 kg with Regiocit at Qb 150 warns about the citrate dose floor',
    R5.warnings.some(w => /citrate solution/.test(w)) ? 1 : 0, 1, 0);
  let r5tiny = 0;
  [60, 80, 100, 120, 150].forEach(w => {
    const s = C.suggestPrescription({ weightKg: w, hematocrit: 0.3, modality: 'CVVHDF', bloodFlow_mL_min: 150,
      targetDeliveredDose_mL_kg_hr: 25, uptimeFraction: 0.9, netUltrafiltration_mL_hr: 100,
      citrateFlow_mL_hr: 1500, preFilterShare: 0.2 });
    if (s.replacementPost_mL_hr > 0 && s.replacementPost_mL_hr < 100) r5tiny++;
  });
  check('R5: no post-filter replacement below 100 mL/hr in generated CVVHDF', r5tiny, 0, 0);

  // R6: invalid inputs are rejected with a warning instead of producing flows.
  let r6 = 0;
  [{ hematocrit: -0.1 }, { hematocrit: 1 }, { uptimeFraction: 0 }, { weightKg: 0 },
   { bloodFlow_mL_min: 0 }, { netUltrafiltration_mL_hr: -100 }, { targetDeliveredDose_mL_kg_hr: 0 }].forEach(bad => {
    const s = C.suggestPrescription(Object.assign({ weightKg: 80, hematocrit: 0.3, modality: 'CVVHDF',
      bloodFlow_mL_min: 150, targetDeliveredDose_mL_kg_hr: 25, uptimeFraction: 0.9 }, bad));
    if (s.warnings.length === 0 || s.targetAchieved !== false) r6++;
    if ([s.dialysateFlow_mL_hr, s.replacementPre_mL_hr, s.replacementPost_mL_hr].some(f => !Number.isFinite(f) || f < 0)) r6++;
  });
  check('R6: invalid inputs warn and return finite, non-negative flows', r6, 0, 0);

  // R7: overshoot from fixed volumes or rounding is always explained.
  const R7 = C.suggestPrescription({ weightKg: 40, hematocrit: 0.3, modality: 'CVVHD', bloodFlow_mL_min: 150,
    targetDeliveredDose_mL_kg_hr: 20, uptimeFraction: 1, netUltrafiltration_mL_hr: 1200 });
  check('R7: net UF above the target dose is warned',
    R7.predictedDeliveredDose_mL_kg_hr > 22 && R7.warnings.length > 0 ? 1 : 0, 1, 0);

  // R8: Tolwani citrate check. 18 mmol/L at 3 mmol/L runs at exactly 10 x Qb.
  let r8 = 0;
  [100, 120, 150, 180, 200, 250].forEach(qb => {
    const f = C.citrateFlowFromTargetDose({ bloodFlow_mL_min: qb, targetCitrateDose_mmol_L: 3, citrateConcentration_mmol_L: 18 }).citrateFlow_mL_hr;
    if (Math.abs(f - 10 * qb) > 1e-9) r8++;
    const back = C.citrateDoseFromFlow({ citrateFlow_mL_hr: f, citrateConcentration_mmol_L: 18, bloodFlow_mL_min: qb }).actualCitrateDose_mmol_L;
    if (Math.abs(back - 3) > 1e-9) r8++;
  });
  check('R8: 18 mmol/L citrate = 10 x Qb and exact round trip at six blood flows', r8, 0, 0);

  // --- Dosing-weight helper ---
  const L = C.computeBMIAndAdjustedWeight({ weightKg: 120, heightCm: 180, sex: 'male' });
  check('L: BMI calculation', L.bmi, 37.04, 0.02);
  check('L: Devine male IBW', L.ibwKg, 75.0, 0.1);
  check('L: adjusted body weight', L.adjustedBodyWeightKg, 93.0, 0.1);
  const Lunspecified = C.computeBMIAndAdjustedWeight({ weightKg: 120, heightCm: 180, sex: 'unspecified' });
  check('L: no IBW assumption when formula unspecified', Lunspecified.ibwKg === null ? 1 : 0, 1, 0);

  // --- Acid-base pattern discrimination (§3.2 three-way) ---
  check(
    'Acid-base: alkalosis pattern',
    C.citrateAcidBasePattern({ pH: 7.50, hco3_mmol_L: 30, caRatio: 2.0 }) === 'alkalosis' ? 1 : 0,
    1, 0
  );
  check(
    'Acid-base: acidosis + normal ratio = under-buffering',
    C.citrateAcidBasePattern({ pH: 7.28, hco3_mmol_L: 18, caRatio: 2.0 }) === 'acidosis_underbuffering' ? 1 : 0,
    1, 0
  );
  check(
    'Acid-base: acidosis + high ratio = accumulation',
    C.citrateAcidBasePattern({ pH: 7.28, hco3_mmol_L: 18, caRatio: 2.9 }) === 'acidosis_accumulation' ? 1 : 0,
    1, 0
  );

  // --- Render ---
  function renderResults() {
  const resultsEl = document.getElementById('results');
  results.forEach(r => {
    const div = document.createElement('div');
    div.className = 'case' + (r.ok ? '' : ' fail-case');
    div.innerHTML = `<span class="${r.ok ? 'pass' : 'fail'}">${r.ok ? 'PASS' : 'FAIL'}</span>: ${r.label} ` +
      `(actual: ${typeof r.actual === 'number' ? r.actual.toFixed(4) : r.actual}, expected: ${r.expected})`;
    resultsEl.appendChild(div);
  });

  document.getElementById('summary').innerHTML =
    `<strong>${pass} passed, ${fail} failed</strong> out of ${pass + fail}`;

  if (fail > 0) {
    document.getElementById('summary').style.color = '#E5533D';
  } else {
    document.getElementById('summary').style.color = '#3FB8AF';
  }
  }

  // --- UI path tests: drive the real Prescribe page in a hidden container ---
  async function uiTests() {
    const [cfg, sol] = await Promise.all([
      fetch('../config/local-protocol.json').then(r => r.json()),
      fetch('../data/solutions.json').then(r => r.json()),
    ]);
    window.CRRTStore = { loadConfig: async () => cfg, loadData: async () => sol };
    const root = document.createElement('div');
    root.style.display = 'none';
    document.body.appendChild(root);
    await window.CRRTUICalculator.mount(root);
    const $ = id => document.getElementById(id);
    const set = (id, v) => { const n = $(id); n.value = String(v); n.dispatchEvent(new Event('input')); n.dispatchEvent(new Event('change')); };
    const numOut = id => parseFloat($(id).textContent);

    // U1: typed values are numbers, not strings (string concatenation bug).
    root.querySelector('[data-anticoag="heparin"]').click();
    root.querySelector('[data-modality="CVVHDF"]').click();
    set('dialysateFlow', 1600); set('replacementPre', 300); set('replacementPost', 300); set('netUF', 100);
    check('U1: effluent after typing = 1600 + 300 + 300 + 100', numOut('out-effluent'), 2300, 0.5);

    // U2: the displayed prescription is exactly the engine's (no UI post-processing).
    $('generatePrescription').click();
    const pred = root.textContent.match(/Current generated prediction: ([\d.]+) mL\/kg\/hr delivered at FF ([\d.]+)%/);
    check('U2: Step 1 prediction equals Step 3 delivered dose', pred ? Math.abs(parseFloat(pred[1]) - numOut('out-delivered')) : 99, 0, 0.05);

    // U3: generator warnings reach the screen (Regiocit dose floor at 40 kg).
    root.querySelector('[data-anticoag="citrate"]').click();
    set('citrateProduct', 'regiocit');
    set('actualWeightKg', 40); set('bloodFlow', 150); set('targetDeliveredDose', 25);
    $('generatePrescription').click();
    check('U3: citrate dose-floor warning is rendered', /citrate solution/.test(root.textContent) ? 1 : 0, 1, 0);

    // U4: amber FF warning renders for a manual edit above the ceiling.
    set('actualWeightKg', 80);
    root.querySelector('[data-anticoag="heparin"]').click();
    set('replacementPre', 0); set('replacementPost', 1800); set('netUF', 0);
    check('U4: FF above ceiling shows a warning', /FF above/.test($('out-warnings').textContent) ? 1 : 0, 1, 0);

    // U5: degenerate inputs never render NaN or Infinity.
    set('actualWeightKg', 0); set('hematocrit', 1); set('bloodFlow', 0);
    check('U5: no NaN or Infinity rendered with zero weight, Hct 1, Qb 0', /NaN|Infinity/.test(root.textContent) ? 1 : 0, 0, 0);
    root.remove();
  }

  uiTests().catch(e => check('UI tests ran without error: ' + e.message, 0, 1, 0)).finally(renderResults);
})();
</script>
</body>
</html>
